<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>경찰청 AI 통합플랫폼 · 통합 콘솔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['"Pretendard Variable"', 'Pretendard', 'system-ui', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
        },
        colors: {
          ink: {
            900: '#070b16',
            850: '#0a0f1c',
            800: '#0f152a',
            700: '#121a32',
            600: '#172241',
            500: '#1d2a52',
            400: '#28365e',
            300: '#384672',
          },
          line: {
            DEFAULT: '#1f2b4d',
            soft:    '#172041',
            hard:    '#28365e',
          },
          text: {
            hi:  '#e7ecf7',
            DEFAULT: '#c7cde0',
            mut: '#8d97b5',
            dim: '#5d6890',
          },
          brand: {
            50:  '#eaf2fb',
            300: '#7eb0e8',
            400: '#4f8fe0',
            500: '#3a7fd1',
            600: '#2563eb',
            700: '#1d4ed8',
            800: '#1e3a8a',
            900: '#001f4d',
          },
          gold:   '#fbbf24',
          silver: '#cbd5e1',
          bronze: '#b45309',
          danger: '#ef4444',
          warn:   '#f59e0b',
          ok:     '#10b981',
        },
        borderRadius: {
          xs: '4px',
          sm: '6px',
          md: '8px',
          lg: '12px',
          xl: '16px',
        },
      },
    },
  };
</script>
<style>
  html, body {
    background: #070b16;
    color: #c7cde0;
    font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif;
    font-feature-settings: "ss01", "cv11";
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.005em;
    overflow: hidden;
  }
  .mono { font-family: "JetBrains Mono", monospace; font-feature-settings: normal; }

  /* Custom scrollbar */
  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-thumb { background: #28365e; border-radius: 4px; }
  *::-webkit-scrollbar-thumb:hover { background: #384672; }
  *::-webkit-scrollbar-track { background: transparent; }

  /* Subtle gridded background */
  .bg-grid {
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 28px 28px;
  }

  /* Soft glow for important panels */
  .panel-glow {
    background:
      radial-gradient(110% 80% at 0% 0%, rgba(37,99,235,0.10), transparent 50%),
      #121a32;
  }

  /* Tick marks for sliders etc */
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    width: 100%;
    height: 16px;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 3px; background: #28365e; border-radius: 3px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: #4f8fe0; margin-top: -6px;
    box-shadow: 0 0 0 3px rgba(79,143,224,0.18);
    cursor: pointer;
  }
  input[type=range]::-moz-range-track {
    height: 3px; background: #28365e; border-radius: 3px;
  }
  input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%; border: 0;
    background: #4f8fe0;
    box-shadow: 0 0 0 3px rgba(79,143,224,0.18);
  }

  /* Pulse for live indicator */
  @keyframes pulse-dot {
    0% { box-shadow: 0 0 0 0 rgba(16,185,129,0.45); }
    70% { box-shadow: 0 0 0 6px rgba(16,185,129,0); }
    100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
  }
  .pulse-ok { animation: pulse-dot 2s infinite; }

  /* Marquee for live ticker */
  @keyframes scroll-x {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  .marquee { animation: scroll-x 40s linear infinite; }
</style>
</head>
<body>

<div id="root"></div>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script type="text/babel" src="platform/app.jsx"></script>
